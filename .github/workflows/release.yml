name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Verify and publish npm package
    if: github.repository_owner == 'zhangz-2018'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install trusted-publishing npm CLI
        run: npm install --global npm@11.6.2
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${package_version}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match package version v${package_version}" >&2
            exit 1
          }
      - name: Verify release artifact
        run: pnpm verify
      - name: Verify protected main ancestry and changelog
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --force
          git merge-base --is-ancestor HEAD origin/main || {
            echo "Tagged commit is not contained in protected main." >&2
            exit 1
          }
          grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md
          grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.zh-CN.md
      - name: Verify package contents
        shell: bash
        run: |
          set -euo pipefail
          pnpm pack --dry-run --json | awk 'BEGIN {found=0} /^\{/ {found=1} found {print}' > package-pack.json
          node - <<'NODE
          const fs = require('node:fs')
          const pack = JSON.parse(fs.readFileSync('package-pack.json', 'utf8'))
          const files = new Set(pack.files.map((entry) => entry.path))
          for (const required of ['lib/index.js', 'lib/client.js', 'lib/pdf.worker.mjs', 'README.md', 'SECURITY.md', 'CHANGELOG.md']) {
            if (!files.has(required)) throw new Error(`Missing package file: ${required}`)
          }
          NODE
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
      - name: Publish with npm provenance
        run: npm publish --provenance --access public

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish generated release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" || gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes
